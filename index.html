<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pragmatic Research, Inc.</title>

    <meta name="description" content="Pragmatic Research, Inc. is working on something new. Coming soon.">
    <meta name="author" content="Aniketh Bandlamudi">

    <meta property="og:title" content="Pragmatic Research, Inc.">
    <meta property="og:description" content="Something new is coming soon.">
    <meta property="og:type" content="website">
    <meta property="og:url" content="https://aniketh.net/pragmatic/">
    <meta property="og:image" content="https://aniketh.net/pragmatic/assets/pragmaticog.png">
    <meta name="twitter:card" content="summary_large_image">
    <link rel="canonical" href="https://aniketh.net/pragmatic/">

    <script type="application/ld+json">
    {
        "@context": "https://schema.org",
        "@type": "Organization",
        "@id": "https://aniketh.net/pragmatic/#organization",
        "name": "Pragmatic Research, Inc.",
        "url": "https://aniketh.net/pragmatic/",
        "logo": "https://aniketh.net/pragmatic/assets/pragmaticicon.png",
        "email": "me@aniketh.net",
        "founder": { "@id": "https://aniketh.net/#person" }
    }
    </script>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital@0;1&display=swap" rel="stylesheet">

    <link rel="icon" type="image/png" sizes="180x180" href="/pragmatic/assets/pragmaticfavicon.png">
    <link rel="icon" type="image/svg+xml" href="/pragmatic/assets/pragmatic.svg">
    <link rel="apple-touch-icon" href="/pragmatic/assets/pragmaticfavicon.png">
    <meta name="theme-color" content="#f2efe6" media="(prefers-color-scheme: light)">
    <meta name="theme-color" content="#1a1712" media="(prefers-color-scheme: dark)">

    <style>
        :root {
            --paper: #f2efe6;
            --ink: #1a1712;
            --quiet: rgba(26, 23, 18, 0.58);
            --serif: 'EB Garamond', Garamond, Georgia, serif;
            --pad: clamp(22px, 6vw, 96px);
            --gutter: var(--pad);
            color-scheme: light dark;
        }
        @media (prefers-color-scheme: dark) {
            :root {
                --paper: #1a1712;
                --ink: #f2efe6;
                --quiet: rgba(242, 239, 230, 0.58);
            }
        }

        * { box-sizing: border-box; }
        html, body { margin: 0; }
        body {
            min-height: 100vh;
            min-height: 100svh;
            display: flex;
            flex-direction: column;
            background: var(--paper);
            color: var(--ink);
            font-family: var(--serif);
            font-size: 18px;
            line-height: 1.5;
            -webkit-font-smoothing: antialiased;
            text-rendering: optimizeLegibility;
        }

        main, footer {
            position: relative;
            z-index: 1;
        }
        main {
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            padding: var(--pad);
            padding-bottom: calc(var(--pad) * 1.4);
        }
        .mark {
            display: block;
            width: clamp(34px, 3.4vw, 44px);
            height: auto;
            margin-bottom: clamp(28px, 3.6vw, 44px);
        }
        h1 {
            margin: 0;
            font-weight: 400;
            font-size: clamp(44px, 8.4vw, 112px);
            line-height: 1.02;
            letter-spacing: -0.015em;
        }
        .soon {
            margin: clamp(14px, 1.6vw, 22px) 0 0;
            font-style: italic;
            font-size: clamp(22px, 2.6vw, 32px);
            color: var(--quiet);
        }

        footer {
            display: flex;
            flex-wrap: wrap;
            justify-content: space-between;
            gap: 8px 24px;
            padding: 0 var(--pad) clamp(22px, 3vw, 36px);
            font-size: 16px;
            color: var(--quiet);
        }
        footer a {
            color: inherit;
            text-decoration: none;
            transition: color 0.18s ease;
        }
        footer a:hover, footer a:focus-visible { color: var(--ink); }

        @media (prefers-reduced-motion: no-preference) {
            main > * { animation: rise 0.5s cubic-bezier(0.22, 0.61, 0.36, 1) both; }
            main > :nth-child(2) { animation-delay: 0.06s; }
            main > :nth-child(3) { animation-delay: 0.12s; }
            @keyframes rise {
                from { opacity: 0; transform: translateY(10px); }
            }
        }
    </style>
</head>
<body>
    <main>
        <svg class="mark" viewBox="0 0 100 100" role="img" aria-label="Pragmatic Research mark">
            <rect width="100" height="100" fill="currentColor"/>
            <rect x="30" y="30" width="40" height="40" transform="rotate(45 50 50)" fill="var(--paper)"/>
        </svg>
        <h1>Pragmatic Research</h1>
        <p class="soon">Something new is coming soon.</p>
    </main>
    <footer>
        <a href="mailto:me@aniketh.net">me@aniketh.net</a>
        <span>© 2026 Pragmatic Research, Inc.</span>
    </footer>

    <script src="/pragmatic/water.js" defer></script>
</body>
</html>
