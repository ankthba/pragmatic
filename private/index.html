:root{--paper:#f2efe6;--ink:#1a1712;--quiet:rgba(26,23,18,.58);--rule:rgba(26,23,18,.18);--err:#9b2c1f;--serif:'EB Garamond',Garamond,Georgia,serif;color-scheme:light dark}
@media (prefers-color-scheme:dark){:root{--paper:#1a1712;--ink:#f2efe6;--quiet:rgba(242,239,230,.58);--rule:rgba(242,239,230,.2);--err:#f08a74}}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--paper);color:var(--ink);font-family:var(--serif);font-size:18px;line-height:1.5;-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}
.pg-gate{min-height:100vh;min-height:100svh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:32px 16px}
.pg-gate-main{width:100%;max-width:320px;display:flex;flex-direction:column;align-items:center}
.pg-mark svg{width:44px;height:44px;fill:var(--ink);display:block}
.pg-name{margin:14px 0 30px;font-size:22px;letter-spacing:.01em}
.pg-form{width:100%;display:flex;flex-direction:column}
.pg-label{font-size:15px;color:var(--quiet);margin-bottom:6px}
.pg-input{font:inherit;font-size:17px;color:var(--ink);background:transparent;border:0;border-bottom:1px solid var(--rule);padding:8px 2px;outline:none;width:100%;border-radius:0}
.pg-input:focus{border-bottom-color:var(--ink)}
.pg-error{color:var(--err);font-size:15px;margin-top:10px}
.pg-check{display:flex;align-items:center;gap:8px;font-size:15px;color:var(--quiet);margin:18px 0 22px;cursor:pointer}
.pg-check input{accent-color:var(--ink);width:15px;height:15px;margin:0}
.pg-btn{font:inherit;font-size:17px;color:var(--paper);background:var(--ink);border:0;border-radius:2px;padding:10px 16px;cursor:pointer}
.pg-btn:disabled{opacity:.6;cursor:default}
.pg-btn:focus-visible,.pg-input:focus-visible,.pg-check input:focus-visible{outline:2px solid var(--ink);outline-offset:3px}
.pg-noscript{color:var(--quiet);font-size:15px}
.pg-gate-footer{margin-top:48px;font-size:14px;color:var(--quiet)}
html.pg-auto .pg-gate{visibility:hidden}
</style>

<script>
/* Unlock: derives the key from the password, decrypts and unpacks the page,
   then shows it. Holds no page content of its own. */
(function () {
  'use strict';
  var D = document, W = window, html = D.documentElement;
  var NS = 'pragmatic-private', KEPT = NS + ':kept', LOCKED = NS + ':locked';
  var data = JSON.parse(D.getElementById('pg-payload').textContent);
  var form = D.getElementById('pg-form');
  var pwIn = D.getElementById('pg-pw');
  var keep = D.getElementById('pg-keep');
  var btn = D.getElementById('pg-btn');
  var err = D.getElementById('pg-error');
  var te = new TextEncoder();
  var unlocked = false;
  var UNSUPPORTED = 'This browser cannot open this page. Please use a current version of Chrome, Edge, Firefox or Safari.';

  function fromB64(s) { var bin = atob(s), u = new Uint8Array(bin.length); for (var i = 0; i < bin.length; i++) u[i] = bin.charCodeAt(i); return u; }
  function local(fn) { try { return fn(W.localStorage); } catch (e) { return null; } }
  function timeout(p, ms) { return Promise.race([p, new Promise(function (ok, fail) { setTimeout(function () { fail(new Error('timeout')); }, ms); })]); }
  function supported() { return !!(W.crypto && W.crypto.subtle && typeof W.DecompressionStream === 'function' && W.TextEncoder); }

  /* Saved sign-in. Nothing is stored unless "Keep me signed in" is ticked. When
     it is, the key is kept in IndexedDB as a non-extractable CryptoKey: scripts
     on this site can ask the browser to use it, but can never read its bytes. */
  function db() {
    return new Promise(function (resolve, reject) {
      var req;
      try { req = W.indexedDB.open(NS, 1); } catch (e) { reject(e); return; }
      req.onupgradeneeded = function () { req.result.createObjectStore('keys'); };
      req.onsuccess = function () { resolve(req.result); };
      req.onerror = function () { reject(req.error); };
      req.onblocked = function () { reject(new Error('blocked')); };
    });
  }
  function keyStore(mode, op) {
    return timeout(db().then(function (d) {
      return new Promise(function (resolve, reject) {
        var tx = d.transaction('keys', mode), req = op(tx.objectStore('keys')), out;
        req.onsuccess = function () { out = req.result; };
        tx.oncomplete = function () { d.close(); resolve(out); };
        tx.onerror = tx.onabort = function () { d.close(); reject(tx.error); };
      });
    }), 4000);
  }
  function forget() {
    var had = local(function (s) { var v = s.getItem(KEPT); s.removeItem(KEPT); return v; });
    if (!had) return Promise.resolve();
    return keyStore('readwrite', function (s) { return s.delete('current'); }).catch(function () {});
  }
  function keepKey(key) {
    return keyStore('readwrite', function (s) { return s.put({ s: data.salt, k: key }, 'current'); })
      .then(function () { local(function (s) { s.setItem(KEPT, '1'); }); }, function () {});
  }
  function savedKey() {
    if (!local(function (s) { return s.getItem(KEPT); })) return Promise.resolve(null);
    return keyStore('readonly', function (s) { return s.get('current'); }).then(function (rec) {
      if (rec && rec.s === data.salt && rec.k) return rec.k;
      return forget().then(function () { return null; }); // left over from an older build or password
    }, function () { return null; });
  }

  /* Lock: forget the saved key and close the page in every open tab. */
  function relock() {
    try { history.replaceState(null, '', location.pathname + location.search); } catch (e) {}
    location.reload();
  }
  var channel = null;
  try { channel = new BroadcastChannel(NS); channel.onmessage = function (e) { if (e.data === 'lock' && unlocked) relock(); }; } catch (e) {}
  W.addEventListener('storage', function (e) { if (e.key === LOCKED && unlocked) relock(); });
  W.__pgLock = function () {
    forget().then(function () {
      try { if (channel) channel.postMessage('lock'); } catch (e) {}
      local(function (s) { s.setItem(LOCKED, String(Date.now())); });
      relock();
    });
  };

  async function deriveKey(password) {
    var base = await crypto.subtle.importKey('raw', te.encode(password.normalize('NFC')), 'PBKDF2', false, ['deriveKey']);
    return crypto.subtle.deriveKey({ name: 'PBKDF2', hash: 'SHA-256', salt: fromB64(data.salt), iterations: data.iter }, base, { name: 'AES-GCM', length: 256 }, false, ['decrypt']);
  }
  /* The decrypted block is a 4-byte length, the gzipped page, then padding that
     hides the page's true size. */
  async function unlock(key) {
    var plain = new Uint8Array(await crypto.subtle.decrypt({ name: 'AES-GCM', iv: fromB64(data.iv), additionalData: te.encode(data.aad), tagLength: 128 }, key, fromB64(data.ct)));
    var n = new DataView(plain.buffer, plain.byteOffset, 4).getUint32(0);
    if (n > plain.length - 4) throw new Error('bad length');
    var unzipped = new Blob([plain.subarray(4, 4 + n)]).stream().pipeThrough(new DecompressionStream('gzip'));
    return JSON.parse(await new Response(unzipped).text());
  }
  function mount(bundle) {
    unlocked = true;
    var st = D.createElement('style');
    st.textContent = bundle.css;
    D.head.appendChild(st);
    html.classList.remove('pg-auto');
    D.body.innerHTML = bundle.shell;
    (new Function('B', bundle.js))(bundle);
  }
  function showErr(msg) { err.textContent = msg; err.hidden = false; }
  function busy(on) { btn.disabled = on; btn.textContent = on ? 'Opening…' : 'Open'; }
  function reveal() { html.classList.remove('pg-auto'); pwIn.focus(); }

  form.addEventListener('submit', async function (ev) {
    ev.preventDefault();
    var pw = String(pwIn.value || '');
    if (!pw) { showErr('Enter the password.'); pwIn.focus(); return; }
    if (!supported()) { showErr(UNSUPPORTED); return; }
    busy(true);
    err.hidden = true;
    var key, bundle;
    try {
      key = await deriveKey(pw);
      bundle = await unlock(key);
    } catch (e) {
      busy(false);
      showErr('That password is not right.');
      pwIn.focus(); pwIn.select();
      return;
    }
    pwIn.value = '';
    await forget();
    if (keep.checked) await keepKey(key);
    mount(bundle);
  });

  async function boot() {
    if (data.preview) { mount(JSON.parse(D.getElementById('pg-bundle').textContent)); return; }
    if (!supported()) { html.classList.remove('pg-auto'); showErr(UNSUPPORTED); btn.disabled = true; return; }
    var key = await savedKey();
    if (key) {
      try { mount(await unlock(key)); return; } catch (e) { await forget(); }
    }
    reveal();
  }
  boot();
})();
</script>
